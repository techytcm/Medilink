{% extends "base.html" %}
{% block title %}Settings — MediLink{% endblock %}
{% block content %}
<div class="relative overflow-hidden bg-ink-950 min-h-screen">
  <!-- Ambient background blobs -->
  <div class="absolute top-0 right-0 w-96 h-96 bg-brand-500/10 rounded-full blur-[120px] pointer-events-none"></div>
  <div class="absolute bottom-0 left-0 w-96 h-96 bg-cyan-500/10 rounded-full blur-[120px] pointer-events-none"></div>
  <!-- Dotted grid pattern -->
  <div class="absolute inset-0 opacity-[0.03]" style="background-image: radial-gradient(currentColor 1px, transparent 1px); background-size: 24px 24px;"></div>

  <div class="relative p-4 sm:p-6 lg:p-8 max-w-3xl mx-auto space-y-8">
    
    <!-- Header -->
    <div class="flex items-center gap-4 pt-2">
      <div class="w-12 h-12 rounded-2xl bg-white/5 border border-white/10 shadow-sm grid place-items-center">
        <svg class="w-6 h-6 text-brand-400" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.24-.438.613-.431.992a6.759 6.759 0 010 .255c-.007.378.138.75.43.99l1.005.828c.424.35.534.954.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.28c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.992a6.932 6.932 0 010-.255c.007-.378-.138-.75-.43-.99l-1.004-.828a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.281z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
      </div>
      <div>
        <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">Settings</h1>
        <p class="text-sm text-slate-400 mt-0.5">Manage your application preferences.</p>
      </div>
    </div>

    <!-- Preferences Card -->
    <form method="post" class="p-8 rounded-3xl bg-ink-900/50 backdrop-blur-xl border border-white/5 shadow-2xl shadow-black/20 space-y-6">
      <div class="flex items-center gap-3 mb-2">
        <span class="w-9 h-9 rounded-lg bg-white/5 border border-white/10 grid place-items-center">
          <svg class="w-5 h-5 text-brand-400" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09z" /></svg>
        </span>
        <h2 class="font-bold text-lg text-white tracking-tight">Preferences</h2>
      </div>


      <!-- Toggle 1 -->
      <label class="flex items-center justify-between cursor-pointer p-4 rounded-2xl bg-white/5 border border-white/10 hover:border-brand-500/30 transition-colors">
        <div>
          <p class="font-semibold text-white text-sm">Email notifications</p>
          <p class="text-xs text-slate-400 mt-0.5">Receive updates via email</p>
        </div>
        <div class="relative">
          <input type="checkbox" name="email_notifications" checked class="sr-only peer">
          <div class="w-11 h-6 bg-white/10 rounded-full peer peer-checked:bg-brand-500 transition-colors"></div>
          <div class="absolute top-1 left-1 w-4 h-4 bg-white rounded-full transition-transform peer-checked:translate-x-5 shadow-sm"></div>
        </div>
      </label>

      <!-- Toggle 2 -->
      <label class="flex items-center justify-between cursor-pointer p-4 rounded-2xl bg-white/5 border border-white/10 hover:border-brand-500/30 transition-colors">
        <div>
          <p class="font-semibold text-white text-sm">Appointment reminders</p>
          <p class="text-xs text-slate-400 mt-0.5">Get alerts for upcoming appointments</p>
        </div>
        <div class="relative">
          <input type="checkbox" name="appointment_reminders" checked class="sr-only peer">
          <div class="w-11 h-6 bg-white/10 rounded-full peer peer-checked:bg-brand-500 transition-colors"></div>
          <div class="absolute top-1 left-1 w-4 h-4 bg-white rounded-full transition-transform peer-checked:translate-x-5 shadow-sm"></div>
        </div>
      </label>

      <!-- Submit -->
      <div class="pt-2 flex justify-end">
        <button type="submit" class="px-8 py-3.5 rounded-full bg-white text-ink-950 hover:bg-brand-400 hover:text-ink-950 font-bold shadow-lg shadow-white/10 transition-all hover:scale-[1.01] flex items-center gap-2">
          Save preferences
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" /></svg>
        </button>
      </div>
    </form>

    <!-- Danger Zone -->
    <div class="p-8 rounded-3xl bg-red-500/10 border border-red-500/20 backdrop-blur-xl shadow-lg shadow-black/20">
      <div class="flex items-start gap-4">
        <div class="w-10 h-10 rounded-xl bg-red-500/10 border border-red-500/20 grid place-items-center flex-shrink-0">
          <svg class="w-5 h-5 text-red-400" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" /></svg>
        </div>
        <div>
          <h2 class="font-bold text-red-300 text-lg tracking-tight">Danger zone</h2>
          <p class="text-sm text-red-300/80 mt-1.5 leading-relaxed">Account deletion is irreversible. Please contact our support team to proceed with this action.</p>
          <button class="mt-4 px-4 py-2 rounded-full bg-red-500 hover:bg-red-600 text-white text-xs font-bold transition-transform hover:scale-105 shadow-sm">
            Contact support
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
